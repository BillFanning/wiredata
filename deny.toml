# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
# Enforced in CI: dependency licenses, security advisories, and crate sources.
# Run locally with: cargo deny check

[graph]
# Check the dependency graph across all features (the GUI pulls extra deps).
all-features = true

[advisories]
# RustSec advisory DB. Vulnerabilities fail by default; unmaintained/yanked warn.
# Add advisory IDs here (with a note) only to consciously accept a known issue.
ignore = [
    # quick-xml 0.39.4 DoS advisories (quadratic duplicate-attribute check;
    # unbounded namespace-declaration allocation). Fixed in quick-xml >= 0.41,
    # but our only path to it is wayland-scanner (a PROC-MACRO that parses
    # vendored Wayland protocol XML at BUILD time, Linux targets only) and the
    # latest wayland-scanner (0.31.10 as of 2026-07) still requires ^0.39 — no
    # compatible fix exists yet. Not attacker-reachable: no untrusted XML is
    # ever parsed at runtime by this workspace. Remove both entries when
    # wayland-scanner releases against quick-xml 0.41 (`cargo update` then
    # `cargo deny check` to confirm).
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # zvariant, zbus_names and zvariant_derive are unmaintained (advisories of
    # 2026-11). Linux targets only: `rfd`'s file dialogs reach the desktop's
    # file picker through the XDG portal (`ashpd`), which runs over zbus.
    # Unmaintained, not vulnerable; neither app uses them directly. The other
    # way out, rfd's GTK3 backend, would make every Linux build need the GTK3
    # development libraries. A new vulnerability in these crates has a new ID
    # and still fails. Remove these when rfd/ashpd move off them: cargo-deny
    # warns once an entry matches nothing.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
# Allow-list every license actually present in the tree (verified with
# `cargo deny list`). Anything not listed fails — so a new dependency on a
# copyleft/unknown license is caught in CI. There are currently no copyleft-only
# deps: the GPL/LGPL crates (self_cell, unescaper, r-efi) are all dual-licensed
# with a permissive option, satisfied by MIT/Apache below.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",       # serialport, option-ext (weak, file-level copyleft — fine as a dep)
    "Unicode-3.0",   # icu_*, unicode-ident
    "Zlib",
    "OFL-1.1",          # egui's bundled default fonts (epaint_default_fonts)
    "Ubuntu-font-1.0",  # ditto
]
confidence-threshold = 0.8

[bans]
# The Windows/GUI stack pulls many transitive duplicate versions (windows-sys,
# socket2, thiserror, rustix, getrandom, …) that we can't dedupe ourselves —
# surface them as warnings rather than failing the build.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Only crates.io — no git or unknown registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
