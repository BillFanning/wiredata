[package]
name        = "talker"
description = "Send byte-oriented data over serial and network connections for device testing"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
rust-version.workspace = true

[[bin]]
name = "talker"
path = "src/main.rs"

# Flash-free GUI launcher: a Windows "windows" subsystem app (no console
# allocated on double-click). The `talker` binary above stays a console app for
# terminal CLI/headless use; this one is just the desktop GUI entry point.
# Mirrors listener's two-binary pattern — see src/bin/talker-gui.rs.
[[bin]]
name = "talker-gui"
path = "src/bin/talker-gui.rs"

# Ctrl-C, SIGTERM and SIGHUP on Unix. On Windows, wiredata-stop handles the
# console events instead: it holds a console close until the stop finishes.
[target.'cfg(not(windows))'.dependencies]
ctrlc = { workspace = true }

[dependencies]
# Workspace crates
nmea0183 = { path = "../nmea0183" }
wiredata-ui = { path = "../wiredata-ui" }   # shared GUI chrome (ADR-016)
wiredata-timing = { path = "../wiredata-timing" }
wiredata-telemetry = { path = "../wiredata-telemetry" }
wiredata-log = { path = "../wiredata-log" }         # bounded log-file worker (ADR-061)
wiredata-stop = { path = "../wiredata-stop" }       # Windows stop requests (ADR-060)

# Serial
serialport = { workspace = true }

# GUI
eframe  = { workspace = true }
egui    = { workspace = true }

# CLI
clap  = { workspace = true }

# Threading
crossbeam-channel = { workspace = true }

# Sockets (multicast interface / TTL selection)
socket2 = { workspace = true }

# Logging
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender   = { workspace = true }

# Error handling (application-level)
anyhow = { workspace = true }

# Profiles
serde = { workspace = true }
toml  = { workspace = true }

# Paths
dirs = { workspace = true }

# CRC
crc = { workspace = true }

# File dialogs
rfd = { workspace = true }

# Timestamps
chrono = { workspace = true }

# FreeConsole for the GUI path of the console binary (`talker --gui`), so a
# double-click of talker.exe into the GUI doesn't keep an empty console window.
# talker-gui.exe never allocates one in the first place (windows subsystem).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[dev-dependencies]
criterion = { workspace = true }
# Integration tests live in /tests per Rust convention
serde_json = "1"

# Criterion provides its own main; `harness = false` keeps libtest out of the way.
[[bench]]
name = "scheduler"
harness = false
