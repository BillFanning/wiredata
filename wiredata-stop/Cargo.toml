[package]
name = "wiredata-stop"
description = "Internal OS stop requests for wiredata command-line applications"
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The Tokio stream of every stop request, for listener. Without it the crate
# needs no async runtime, which talker relies on (talker ADR-002).
tokio = ["dep:tokio"]

[dependencies]
tokio = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
