[package]
name        = "listener"
description = "Receive byte-oriented data streams from serial and network connections"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
rust-version.workspace = true

[[bin]]
name = "listener"
path = "src/main.rs"

# Flash-free GUI launcher: a Windows "windows" subsystem app (no console allocated
# on double-click). The `listener` binary above stays a console app for terminal
# CLI/headless use; this one is just the desktop GUI entry point. See
# src/bin/listener-gui.rs.
[[bin]]
name = "listener-gui"
path = "src/bin/listener-gui.rs"

[dependencies]

# Shared GUI chrome: fonts, palette, base style (ADR-019)
wiredata-ui = { path = "../wiredata-ui" }
wiredata-timing = { path = "../wiredata-timing" }
wiredata-telemetry = { path = "../wiredata-telemetry" }
wiredata-log = { path = "../wiredata-log" }         # persistent event log worker (ADR-044)
wiredata-stop = { path = "../wiredata-stop", features = ["tokio"] }  # every OS stop request (ADR-049)
wiredata-cli = { path = "../wiredata-cli" }         # unattended-run reporting (ADR-050)

# Presentation-only construction of inline NMEA ZDA Mark annotations (ADR-025).
# Listener remains stream-only: received bytes are never decoded as NMEA.
nmea0183 = { path = "../nmea0183" }

# Error handling (application-level)
anyhow = { workspace = true }

# Library-style typed errors for the core data model (shared error enums, §95)
thiserror = { workspace = true }

# Channel / display-view / config identifiers (§129, §80.1)
uuid = { workspace = true }

# Async runtime + cooperative cancellation (ADR-001 / spec §97.1, §111)
tokio = { workspace = true }
tokio-util = { workspace = true }

# Serial port I/O — runs on a dedicated OS thread (ADR-001 / spec §97.1)
serialport = { workspace = true }

# Calendar time for time-based recording-file rotation (§59) — local-time period
# keys, so rotated filenames match the operator's wall clock
chrono = { workspace = true }

# Raw socket options: SO_RCVBUF to mitigate kernel UDP drops (§167, §101)
socket2 = { workspace = true }

# The host's local addresses, listed in the UDP bind choice (§15, ADR-047)
if-addrs = { workspace = true }

# Filesystem free space for the recording disk-space guard (§168, §56.2)
fs4 = { workspace = true }

# async methods in the recorder traits (§142)
async-trait = { workspace = true }

# Profile schema serialization (TOML) — §72
serde = { workspace = true }
toml = { workspace = true }

# CLI argument parsing (thin presentation layer, §3)
clap = { workspace = true }

# GUI presentation layer (§3). eframe/egui share a minor version; the GUI thread
# is a thin layer that exchanges commands/updates with the async runtime over
# channels and never blocks or does I/O (AGENTS §5, listener ADR-008).
eframe = { workspace = true }
egui = { workspace = true }
# Native file/folder picker for the recording-destination "Browse…" button.
rfd = { workspace = true }

# Diagnostic logging (§114) — tracing facade + env-filtered subscriber
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }                           # event log folder (§118)

# Windows console handling for the GUI (§3): the binary stays a console-subsystem
# app so the headless CLI works when run from a terminal, and the GUI path detaches
# the console (FreeConsole) so a double-click doesn't leave an empty console window.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

# Linux ancillary receive metadata: per-socket SO_RXQ_OVFL counts and optional
# SO_TIMESTAMPNS software arrival timestamps.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# Cross-app loopback tests drive Talker's real UDP interface into Listener's
# orchestrator. This is test-only; Listener has no production dependency on Talker.
talker = { path = "../talker" }
# Integration tests (listener/tests/) drive the runtime over loopback sockets.
# `test-util` adds the paused-clock (`start_paused` + `advance`) used to test
# timer-driven behavior (the periodic recorder flush) without real waits.
tokio = { workspace = true, features = ["test-util"] }

# Criterion provides its own main; `harness = false` keeps libtest out of the way.
[[bench]]
name = "pipeline"
harness = false
