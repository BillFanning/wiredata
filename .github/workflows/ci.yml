name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build + test + clippy on all three target OSes. clippy runs per-OS on purpose:
  # the Windows-only console handling (`#[cfg(windows)]` FreeConsole / windows-sys)
  # is compiled and linted only on Windows, so a Linux-only check would miss it.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # Linux build deps: serialport needs libudev; eframe/egui (glow + winit)
      # needs the X11/XCB/xkb/GL headers. macOS and Windows need no extra packages.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libudev-dev \
            libxkbcommon-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Broken links and links to private items fail here, so rustdoc warnings
      # cannot pile up unseen. Per-OS for the same reason as clippy.
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Formatting is platform-independent, so check it once.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Dependency policy (deny.toml): licenses, RustSec security advisories,
  # banned/duplicate crates, and crate sources. Subsumes cargo-audit's advisory
  # scan. Prebuilt cargo-deny binary (downloaded, not compiled) for speed.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  # Linux release binaries to download from the run's page. Built only once the
  # tests pass on every OS, so a broken push leaves none. Ubuntu 22.04 rather
  # than latest: a binary runs only on a glibc at least as new as the one it was
  # built against, so the older base runs on more distributions. Packed as a
  # tar.gz because the artifact's zip would drop the execute permission.
  linux-binaries:
    name: Linux binaries
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libudev-dev \
            libxkbcommon-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release -p talker -p listener

      - name: Pack
        id: pack
        run: |
          name="wiredata-linux-x86_64-${GITHUB_SHA::7}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          mkdir "$name"
          cp target/release/{talker,talker-gui,listener,listener-gui,linemon} "$name/"
          tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.name }}.tar.gz
          retention-days: 30
          if-no-files-found: error
